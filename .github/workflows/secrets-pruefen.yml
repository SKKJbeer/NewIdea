# Zeigt NUR, welche Apple-/Meta-/Suchmaschinen-Secrets (und Variablen) in diesem Repository gesetzt sind (ja/nein) — nie Werte.
name: Secrets prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Vorhandene Namen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_CONTACT_PHONE: ${{ secrets.APPLE_CONTACT_PHONE }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_KURZ_TOKEN: ${{ secrets.META_KURZ_TOKEN }}
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          VAR_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          GOOGLE_VERIFICATION: ${{ secrets.GOOGLE_VERIFICATION }}
          VAR_GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
          GOOGLE_SITE_VERIFICATION_CODE: ${{ secrets.GOOGLE_SITE_VERIFICATION_CODE }}
          VAR_GOOGLE_SITE_VERIFICATION_CODE: ${{ vars.GOOGLE_SITE_VERIFICATION_CODE }}
          GOOGLE_SEARCH_CONSOLE: ${{ secrets.GOOGLE_SEARCH_CONSOLE }}
          VAR_GOOGLE_SEARCH_CONSOLE: ${{ vars.GOOGLE_SEARCH_CONSOLE }}
          SEARCH_CONSOLE: ${{ secrets.SEARCH_CONSOLE }}
          VAR_SEARCH_CONSOLE: ${{ vars.SEARCH_CONSOLE }}
          GSC_VERIFICATION: ${{ secrets.GSC_VERIFICATION }}
          VAR_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          VAR_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          for n in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_P8 \
                   ASC_KEY_ID ASC_ISSUER_ID ASC_KEY ASC_PRIVATE_KEY ASC_API_KEY APP_STORE_CONNECT_API_KEY \
                   APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY \
                   APPLE_KEY_ID APPLE_ISSUER_ID APPLE_API_KEY TEAM_ID MATCH_PASSWORD FASTLANE_SESSION BUILD_CERTIFICATE_BASE64 \
                   APPLE_CONTACT_PHONE META_APP_ID META_APP_SECRET META_KURZ_TOKEN META_SYSTEM_TOKEN INSTAGRAM_ACCESS_TOKEN INSTAGRAM_BUSINESS_ACCOUNT_ID \
                   GOOGLE_SITE_VERIFICATION VAR_GOOGLE_SITE_VERIFICATION GOOGLE_VERIFICATION VAR_GOOGLE_VERIFICATION GOOGLE_SITE_VERIFICATION_CODE VAR_GOOGLE_SITE_VERIFICATION_CODE GOOGLE_SEARCH_CONSOLE VAR_GOOGLE_SEARCH_CONSOLE SEARCH_CONSOLE VAR_SEARCH_CONSOLE GSC_VERIFICATION VAR_GSC_VERIFICATION BING_SITE_VERIFICATION VAR_BING_SITE_VERIFICATION; do
            [ -n "${!n}" ] && echo "gesetzt:   $n" || echo "fehlt:     $n"
          done
