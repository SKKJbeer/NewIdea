# Xcode-Projekt wird aus dieser Datei erzeugt (XcodeGen) — keine .xcodeproj im
# Repository, damit Zusammenführungen nicht an der Projektdatei scheitern.
#   brew install xcodegen && cd ios && xcodegen generate
name: CardBeacon
options:
  bundleIdPrefix: de.cardbeacon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
targets:
  CardBeacon:
    type: application
    platform: iOS
    sources:
      - path: CardBeacon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cardbeacon.app
        PRODUCT_NAME: CardBeacon
        INFOPLIST_KEY_CFBundleDisplayName: CardBeacon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  CardBeaconTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CardBeaconTests
    dependencies:
      - target: CardBeacon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cardbeacon.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CardBeacon:
    build:
      targets:
        CardBeacon: all
        CardBeaconTests: [test]
    test:
      targets:
        - CardBeaconTests
